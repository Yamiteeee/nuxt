<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#34d399" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Tracking Pulse -->
  <circle cx="256" cy="256" r="200" stroke="url(#neonGrad)" stroke-width="6" opacity="0.25" />
  <circle cx="256" cy="256" r="160" stroke="url(#neonGrad)" stroke-width="8" stroke-dasharray="16 12" />

  <!-- Central PM Badge -->
  <g filter="url(#lightGlow)">
    <rect x="128" y="148" width="256" height="216" rx="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" />
    <text x="256" y="285" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="105" fill="url(#neonGrad)" text-anchor="middle" letter-spacing="1">PM</text>
  </g>

  <!-- Live Inquiry Indicator Dot -->
  <circle cx="370" cy="160" r="18" fill="#10b981" />
  <circle cx="370" cy="160" r="8" fill="#ffffff" />
</svg>
